apiVersion: batch/v1
kind: CronJob
metadata:
  name: degradation-detector
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "common.selectorLabels" . | nindent 12 }}
        spec:
          securityContext:
            runAsNonRoot: true
          restartPolicy: Never
          # 12 hours
          activeDeadlineSeconds: 43200
          containers:
            - name: degradation-detector
              image: {{ .Values.images.degradationDetector }}
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "2"
                  memory: 512Mi
                limits:
                  cpu: "3"
                  memory: 4Gi
              env:
                - name: SLACK_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ij-perf-slack-token
                      key: token
                - name: BACKEND_URL
                  value: "http://backend:80"
                # The GitHub App that reads the notification settings from the releases of the private repository
                # JetBrains/ide-infrastructure-alerts. Without the secret the detector uses the settings that are
                # built into its image.
                - name: ALERTS_GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.degradationDetector.alertsGithubAppSecret }}
                      key: app-id
                      optional: true
                - name: ALERTS_GITHUB_APP_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.degradationDetector.alertsGithubAppSecret }}
                      key: private-key
                      optional: true
                {{- with .Values.degradationDetector.healthSlackChannel }}
                - name: HEALTH_SLACK_CHANNEL
                  value: {{ . | quote }}
                {{- end }}
              {{- with .Values.degradationDetector.hookSecrets }}
              # The URL and the token of each degradation hook, see setting.Hooks. A missing secret disables its hook.
              envFrom:
                {{- range . }}
                - secretRef:
                    name: {{ . }}
                    optional: true
                {{- end }}
              {{- end }}
          imagePullSecrets:
            - name: ghcr