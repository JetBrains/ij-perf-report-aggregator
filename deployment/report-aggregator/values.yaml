ingress:
  host: ""
  tlsSecretName: ""
  annotations: {}
ingressBackend:
  host: ""
  tlsSecretName: ""
  annotations: {}
collector:
  teamcityUrl: "http://buildserver.labs.intellij.net"
  buildConfigurations: []
degradationDetector:
  healthSlackChannel: ""
  # Kubernetes secret of the GitHub App that can read the releases of JetBrains/ide-infrastructure-alerts, with the
  # keys `app-id` and `private-key` (the PEM file of the app). Socrat reads its settings with the same app. The
  # secret is optional: without it the detector uses the settings of the release that is built into its image and
  # reports that to healthSlackChannel on each run.
  alertsGithubAppSecret: ide-infrastructure-alerts-github-app
  # One Kubernetes secret per degradation hook, see setting.Hooks. Each one is optional: a missing secret disables
  # only its hook.
  hookSecrets:
    - degradation-detector-hook-air-perf
images:
  backend: ko://github.com/JetBrains/ij-perf-report-aggregator/cmd/backend
  frontend: ko://github.com/JetBrains/ij-perf-report-aggregator/cmd/frontend
  clickhouse: ko://github.com/JetBrains/ij-perf-report-aggregator/cmd/clickhouse
  clickhouseBackup: ko://github.com/JetBrains/ij-perf-report-aggregator/cmd/clickhouse-backup
  collector: ko://github.com/JetBrains/ij-perf-report-aggregator/cmd/tc-collector
  degradationDetector: ko://github.com/JetBrains/ij-perf-report-aggregator/cmd/degradation-analyzer